<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %} {% endblock title%}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css_files/responsive.css' %}" />
    <link rel="stylesheet" href="{% static 'css_files/loader.css' %}" />
    {% block head %} {% endblock head %}
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand" href="/">
          <img
            src="/static/media/logo.svg"
            alt="logo.svg"
            width="42"
            height="42"
            class="me-2"
          />
          <strong>Check</strong></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    {% block body %} {% endblock body%}

    <!-- Global Spawning Chess Pieces Loader Overlay -->
    <div id="loader-overlay" role="status" aria-live="polite" aria-label="Loading task in progress">
      <div class="chess-loader-card">
        <div class="chess-spawner-arena">
          <div class="chess-spawn-slot" title="Pawn">
            <img src="/static/media/white_pawn.svg" alt="Pawn" class="chess-piece-spawning" />
            <div class="chess-spawn-glow"></div>
            <div class="chess-pedestal light-square"></div>
          </div>
          <div class="chess-spawn-slot" title="Knight">
            <img src="/static/media/black_knight.svg" alt="Knight" class="chess-piece-spawning" />
            <div class="chess-spawn-glow"></div>
            <div class="chess-pedestal dark-square"></div>
          </div>
          <div class="chess-spawn-slot" title="Bishop">
            <img src="/static/media/white_bishop.svg" alt="Bishop" class="chess-piece-spawning" />
            <div class="chess-spawn-glow"></div>
            <div class="chess-pedestal light-square"></div>
          </div>
          <div class="chess-spawn-slot" title="Rook">
            <img src="/static/media/black_rook.svg" alt="Rook" class="chess-piece-spawning" />
            <div class="chess-spawn-glow"></div>
            <div class="chess-pedestal dark-square"></div>
          </div>
          <div class="chess-spawn-slot" title="Queen">
            <img src="/static/media/white_queen.svg" alt="Queen" class="chess-piece-spawning" />
            <div class="chess-spawn-glow"></div>
            <div class="chess-pedestal light-square"></div>
          </div>
          <div class="chess-spawn-slot" title="King">
            <img src="/static/media/black_king.svg" alt="King" class="chess-piece-spawning" />
            <div class="chess-spawn-glow"></div>
            <div class="chess-pedestal dark-square"></div>
          </div>
        </div>
        <div class="loader-task-info">
          <span id="loader-task-step" class="loader-task-badge">Processing</span>
          <h4 id="loader-task-title" class="loader-task-title">Loading...</h4>
          <p id="loader-task-desc" class="loader-task-desc">Please wait while the task completes...</p>
          <div class="loader-progress-track">
            <div class="loader-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'js_files/loader.js' %}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
