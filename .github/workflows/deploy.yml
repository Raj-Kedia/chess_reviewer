name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  SERVICE_NAME: chess-reviewer
  REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    # Required permissions for Workload Identity Federation (Keyless Auth)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/101589719561/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@project-779f14c7-956f-4fdd-b95.iam.gserviceaccount.com'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --set-env-vars "DEBUG=False,ALLOWED_HOSTS=*"

      - name: Show Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format "value(status.url)")
          echo "### Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Application is live at: [${SERVICE_URL}](${SERVICE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "Service URL: ${SERVICE_URL}"
