version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=True
      - SECRET_KEY=local-dev-secret-key-12345
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
